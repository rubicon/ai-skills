# Worked example of a Salience identity record.
#
# EVERY PERSON, COMPANY, AND NUMBER BELOW IS FICTIONAL. This file ships with the
# plugin as a structural reference. Real records live outside the repository in
# $SALIENCE_HOME and are never committed.
#
# Validates against config/identity.schema.json.

version: "1.0.0"
updated: 2026-09-02

