facts:
  # A verified metric, sourced, with context and attribution both explicit.
  - id: fact-001
    claim: "Cut blended CAC 34% across three business units over 11 months"
    tier: verified
    source: "imports/fy25-final-close.xlsx, tab 'Blended CAC'"
    recorded: 2026-08-14
    role_id: role-hollis
    period: "2024-08..2025-07"
    context: employer-side
    attribution: led-team
    metric:
      value: "34"
      unit: "percent reduction"
      period: "11 months"
      scope: "blended, 3 business units"
    used_in: ["headline-v3", "about-v2", "experience/hollis"]
    history:
      - claim: "Cut blended CAC 38% across three business units over 11 months"
        source: "imports/q3-board-deck-2025.pdf, slide 14"
        superseded: 2026-08-14
        reason: "Q3 deck figure was a projection; final close came in at 34%"

  # Verified, personal attribution — Morgan did this directly.
  - id: fact-002
    claim: "Consolidated the MarTech stack from 14 tools to 6"
    tier: verified
    source: "imports/martech-consolidation-readout.pdf"
    recorded: 2026-08-14
    role_id: role-hollis
    context: employer-side
    attribution: personal
    used_in: ["about-v2", "experience/hollis"]

  # User-stated, no artifact yet. Publishable, flagged once in the delivery note.
  - id: fact-003
    claim: "Grew qualified pipeline 3.4x while holding headcount flat"
    tier: stated
    recorded: 2026-08-14
    role_id: role-hollis
    context: employer-side
    attribution: led-team
    used_in: ["headline-v3"]

  # Inferred by Salience. Must be confirmed before it appears in published copy.
  - id: fact-004
    claim: "Has operated under private-equity ownership"
    tier: inferred
    recorded: 2026-08-20
    role_id: role-hollis
    context: employer-side
    attribution: personal

  # Client-side work. Kept separate from employer-side even where a name repeats.
  - id: fact-005
    claim: "Rebuilt lifecycle marketing for a Series B fintech; trial-to-paid from 9% to 16%"
    tier: verified
    source: "imports/fernwood-engagement-summary.pdf"
    recorded: 2026-08-22
    role_id: role-advisory-fernwood
    context: client-side
    attribution: personal

  # Positioning language, not yet accepted. Never published while tier is 'proposed'.
  - id: fact-006
    claim: "The operator CMOs call when growth stops responding to spend"
    tier: proposed
    recorded: 2026-09-01

  # The company's achievement, not Morgan's. Verified, well sourced, and still
  # not sayable as "I grew the business 55%". Note there is no attribution field:
  # 'personal' or 'led-team' is meaningless once the subject is the organization.
  # Legitimate uses: company context in an Experience scope line, and interview
  # framing. Illegitimate: a headline, an About proof line, a resume bullet.
  - id: fact-007
    claim: "Hollis Data grew 55% year over year during the FY25 period"
    tier: verified
    source: "imports/fy25-final-close.xlsx, tab 'Company'"
    recorded: 2026-08-14
    role_id: role-hollis
    context: employer-side
    subject: organization

  # Quarantined. Sourcing is not the question — permission is. A fact can be
  # verified and still be one that never leaves this file.
  - id: fact-008
    claim: "Reduced cost per qualified conversion by 20% on the Fernwood engagement"
    tier: verified
    source: "imports/fernwood-engagement-summary.pdf, appendix B"
    recorded: 2026-08-22
    role_id: role-advisory-fernwood
    context: client-side
    attribution: personal
    subject: self
    visibility: private
    visibility_reason: >-
      Client has not cleared the figure for external use, anonymized or not.
      Do not publish, do not put in a sent resume, do not paraphrase into a range.

  # Publishable to a search partner, not to the open web. 'shared' is the case
  # most corpora record as prose and then lose.
  - id: fact-009
    claim: "Carried a $40M marketing budget across three business units"
    tier: verified
    source: "imports/fy25-final-close.xlsx, tab 'Plan'"
    recorded: 2026-08-14
    role_id: role-hollis
    context: employer-side
    attribution: personal
    visibility: shared

gaps:
  - id: gap-001
    wants: "A dollar figure for the MarTech consolidation savings"
    why: "Consolidation is the strongest differentiator and currently carries no number"
    blocks: ["headline-v3", "about-proof-line"]
    asked: 2026-08-22
    resolved: null

  - id: gap-002
    wants: "Confirmation of PE ownership at Hollis Data, and the sponsor name if public"
    why: "fact-004 is inferred; PE operating experience is a stated requirement in most target roles"
    blocks: ["role-alignment/*"]
    asked: 2026-08-20
    resolved: null

targets:
