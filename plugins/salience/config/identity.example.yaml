    - "Founders and CEOs at post-product-market-fit B2B SaaS"
    - "PE operating partners"
  consulting_in_scope: true
  compensation_floor: "$385K base"
  deal_breakers:
    - "Relocation outside Central Texas"
    - "Marketing reporting into Sales"
    - "Pre-product-market-fit"

boundaries:
  will_not_claim:
    - "International or EMEA expansion experience"
    - "Category creation - repositioned an existing category, did not create one"
  will_not_be_pitched_for:
    - "Agency-side roles"
    - "Individual-contributor demand-gen roles"
  confidential_clients:
    - "Fernwood Labs"

