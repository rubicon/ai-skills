    depth: core
    evidence: ["fact-002"]
  - area: "Marketing analytics and attribution"
    depth: strong
    evidence: ["fact-001"]
  - area: "Lifecycle and retention marketing"
    depth: strong
    evidence: ["fact-005"]
  - area: "Brand strategy"
    depth: working
    evidence: []
  - area: "International expansion"
    depth: familiar
